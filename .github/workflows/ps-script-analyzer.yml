name: PowerShell Script Analysis

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
  pull_request:
    branches: [main, master]
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"

jobs:
  ps-script-analyzer:
    name: "Analyze PowerShell scripts with PSScriptAnalyzer"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery
          $null = Get-Module PSScriptAnalyzer -ListAvailable

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Include *.ps1,*.psm1,*.psd1 -Severity Error,Warning
          if ($results) {
            $results | Format-Table RuleName, Severity, File, Line, Message -AutoSize | Out-Host
            # Output in GitHub Actions annotation format
            foreach ($r in $results) {
              $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
              echo "::$level file={$r.File},line={$r.Line}::{($r.RuleName)} {$r.Message}"
            }
            throw "PSScriptAnalyzer found issues (see above)"
          } else {
            Write-Host "No issues found." -ForegroundColor Green
          }