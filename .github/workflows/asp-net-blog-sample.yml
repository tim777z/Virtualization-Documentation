name: ASP-NET-Blog-Sample CI

on:
  push:
    branches: [main, master]
    paths:
      - "windows-container-samples/ASP-NET-Blog-Application/**"
      - ".github/workflows/asp-net-blog-sample.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "windows-container-samples/ASP-NET-Blog-Application/**"
      - ".github/workflows/asp-net-blog-sample.yml"

jobs:
  # ------------------------------------------------------------------
  # Validate that the blog-database SQL scripts apply cleanly and
  # produce the expected 28 BlogEngine.NET tables.
  #
  # The sample's Dockerfiles (db/Dockerfile, web/Dockerfile) are based
  # on Windows-only images (microsoft/windowsservercore and
  # microsoft/mssql-server-2014-express-windows), which cannot be built
  # on GitHub-hosted runners. The schema scripts themselves are plain
  # T-SQL, so this job validates them against SQL Server on Linux.
  # ------------------------------------------------------------------
  schema-validation:
    name: "Validate blog database schema"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser -Repository PSGallery
          $null = Get-Module Pester -ListAvailable

      - name: Run schema validation tests (Pester)
        shell: pwsh
        run: |
          Import-Module Pester
          $testPath = "./windows-container-samples/ASP-NET-Blog-Application/tests/schema.Tests.ps1"
          $result = Invoke-Pester $testPath -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "Schema validation tests failed: $($result.FailedCount) failure(s)"
          }
        env:
          # SA_PASSWORD is provided via GitHub Actions secret SA_PASSWORD_TEST
          # Configure in repository Settings > Secrets and variables > Actions
          SA_PASSWORD: ${{ secrets.SA_PASSWORD_TEST }}

  # ------------------------------------------------------------------
  # Validate Docker Compose files syntax and structure
  # ------------------------------------------------------------------
  docker-compose-lint:
    name: "Validate Docker Compose files"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose -f windows-container-samples/ASP-NET-Blog-Application/docker-compose.yml config --quiet
          echo "docker-compose.yml: OK"

      - name: Validate docker-compose.linux.yml
        run: |
          docker compose -f windows-container-samples/ASP-NET-Blog-Application/docker-compose.linux.yml config --quiet
          echo "docker-compose.linux.yml: OK"

  # ------------------------------------------------------------------
  # Validate .env.example has required variables and no secrets
  # ------------------------------------------------------------------
  env-validation:
    name: "Validate environment configuration"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check .env.example exists
        run: |
          test -f windows-container-samples/ASP-NET-Blog-Application/.env.example
          echo ".env.example exists"

      - name: Validate .env.example has no real secrets
        run: |
          # Check for common secret patterns
          if grep -qE "(password|secret|key|token)\s*=\s*[^#\s]{8,}" windows-container-samples/ASP-NET-Blog-Application/.env.example; then
            echo "WARNING: Potential hardcoded secret in .env.example"
            grep -nE "(password|secret|key|token)\s*=" windows-container-samples/ASP-NET-Blog-Application/.env.example
          else
            echo "No hardcoded secrets detected in .env.example"
          fi

      - name: Validate required variables documented
        run: |
          required_vars=("DB_PASSWORD" "DB_NAME" "DB_HOST" "DB_USER")
          for var in "${required_vars[@]}"; do
            if grep -q "^${var}=" windows-container-samples/ASP-NET-Blog-Application/.env.example; then
              echo "✓ $var documented"
            else
              echo "✗ MISSING: $var not found in .env.example"
              exit 1
            fi
          done